name: Build & Deploy Jekyll

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# The site is published from the gh-pages branch (Settings → Pages → "Deploy
# from a branch"), so this workflow pushes the built site there instead of
# uploading a Pages artifact. That lets PR previews (preview.yml) live next to
# it under /pr-preview/pr-<N>/.
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://fhooeaist.github.io/
    steps:
      - uses: actions/checkout@v4

      - name: Checkout code
        uses: nschloe/action-cached-lfs-checkout@v1

      - name: Log LFS Files
        run: |
          git lfs ls-files
          file assets/images/markdown/seekid.png
          ls -lh assets/images/markdown/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - run: npx pagefind --site _site

      # The output is already built; stop GitHub Pages from running Jekyll on it again.
      - run: touch _site/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Keep the PR previews that preview.yml deploys into this folder.
          clean-exclude: pr-preview/
          # Rebase onto gh-pages instead of force-pushing, so a preview pushed
          # at the same time isn't overwritten.
          force: false
