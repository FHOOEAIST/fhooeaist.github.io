title: AIST Research Group
description: >-
  AIST – Advanced Information Systems and Technology. Research group at the University of Applied Sciences Upper Austria, Campus Hagenberg. Focused on eHealth, Machine Learning, and Visual Computing.
baseurl: ""
url: "https://fhooeaist.github.io"
author: "AIST Research Group – University of Applied Sciences Upper Austria"
twitter_handle: "@FHOOEAIST"
og_image: "/assets/images/footer/aist-logo.png"
theme_color: "#ffffff"

# Home-page hero background:
#   small     the thin static wave tile
#   thick     the thick wave strokes and the soft light, standing still
#   animated  the thick strokes drifting in from the right and the light
#             wandering (canvas, see initHeroWaves in assets/js/main.js)
animated_header: animated

# Site design:
#   waves  the dark navy header/footer and the wave hero (animated_header above)
#   tiles  the light layout in the style of fh-ooe.at: white header, square
#          corners and the tile mosaic on the home page
#          (assets/css/theme-tiles.css, home-tiles.css, _includes/home/tiles-*.html)
site_design: tiles

permalink: /:year/:month/:day/:title:output_ext

languages: ["de", "en"]
default_lang: "de"
exclude_from_localization: ["javascript", "images", "css", "assets", "pagefind"]
parallel_localization: false
lang_from_path: true

sass:
  sourcemap: never

pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title: ":title - Seite :num"
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

# Local tooling – not part of the published site
exclude:
  - docker/
  - docker-compose.yml
  - .dockerignore

collections:
  projects:
    output: true
    permalink: /projects/:title/
  publications:
    output: false
  theses:
    output: false

plugins:
  - jekyll-feed
  - jekyll-polyglot
  - jekyll-paginate-v2

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
      css: "projects"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "theses"
    values:
      layout: "thesis"
