# Required: name, category (professor | project_manager | researcher | student,
# labels in _data/team_categories.yml). Everything else is optional and left
# out when missing:
#   gender         m | f, picks the German form of the category label
#   role           free text next to the category (e.g. study programme)
#   email, phone, image, details_url (Pure profile)
#   interests_de / interests_en   list of research interests, shown as tags
#                                 (falls back to the other language)
#   orcid          ORCID iD, e.g. 0000-0002-1825-0097
#   scholar        Google Scholar user id (the `user=` value of the profile URL)
#   github         GitHub handle
#   linkedin       LinkedIn handle (the part after linkedin.com/in/)
# Profile links and interests are up to the members themselves: the links
# pre-filled from Pure, the ORCID registry, Google Scholar and GitHub are
# for each member to check, change or remove.
#
