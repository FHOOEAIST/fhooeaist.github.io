  label_en: Machine Learning & Data Science
  short_de: Machine Learning
  short_en: Machine Learning

- id: se
  label_de: Software Engineering
  label_en: Software Engineering
  short_de: Software Engineering
  short_en: Software Engineering

- id: pm
  label_de: Process Mining & Prozessanalyse
