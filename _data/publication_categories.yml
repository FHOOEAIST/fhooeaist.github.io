# Research categories used by _publications/{de,en}/*.md and _theses/{de,en}/*.md
# via their `categories:` list, and rendered by _includes/listing-filter.html
# (dropdown), _includes/publication-list.html and theses*.html (badges).
#
# An entry may carry several ids. Adding a category here plus assigning it in
# the affected publications and theses is all that is needed — nothing else
# hard-codes the list. The order below is the order shown in the dropdown.
#
#   id       — the value written into a publication's `categories:` list
#   label_*  — full name, used in the filter dropdown
#   short_*  — abbreviated name, used for the badges on each entry

- id: ehealth
  label_de: eHealth & Medizininformatik
  label_en: eHealth & Medical Informatics
  short_de: eHealth
  short_en: eHealth

- id: cv
