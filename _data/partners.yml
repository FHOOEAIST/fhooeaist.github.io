# Project partners, shown as the infinite logo carousel on the home page
# (_includes/home/partners-funders.html). Collected from the free-text
# `partner` of the project phases, de-duplicated and split into single
# organisations. Private individuals and FH OÖ's own units are left out.
#
#   name  — required; shown as text tile until a logo exists, and as alt text
#   url   — partner's website; the tile links there
#   logo  — optional, set by scripts/fetch_partner_logos.py
#           (/assets/images/partners/<file>); check every crawled logo
#   logo_dark_bg — true for a light (white) logo: shown on a dark tile
#   hide  — optional, true leaves the partner out (e.g. consent withdrawn)
#
# Logos are trademarks: see the legal note on issue #19 before publishing
# them, and remove or hide an entry when a partner objects.
#
# Entries without `url` could not be identified with certainty; add the
# website and rerun the logo script for them.

